$NAME_STR "Free Heliport Cargo"

$TYPE_CARGO_STATION
$SUBTYPE_AIRPLANE

$MENU_SFX building_heliport

$STORAGE RESOURCE_TRANSPORT_OPEN 1
$STORAGE RESOURCE_TRANSPORT_GRAVEL 1
$STORAGE RESOURCE_TRANSPORT_COVERED 1
$STORAGE RESOURCE_TRANSPORT_LIVESTOCK 1
$STORAGE RESOURCE_TRANSPORT_CEMENT 1
$STORAGE RESOURCE_TRANSPORT_COOLER 1

$STORAGE_FUEL RESOURCE_TRANSPORT_OIL 25

$VEHICLE_LOADING_FACTOR 0.10
$VEHICLE_UNLOADING_FACTOR 0.10

$WORKING_VEHICLES_NEEDED 1

$NO_LIFESPAN

$WATERSEWAGE_DISABLE
$ELECTRIC_DISABLE
$HEATING_DISABLE

-- Exact native single-helipad vehicle station pathway.
$HELIPORT_STATION 0.0 0.0 -17.0  0.0 0.0 17.0

$CONNECTION_ROAD
0.0 0.0 15.5
0.0 0.0 14.5

$CONNECTION_CONNECTION
0.0 0.0 -15.5
0.0 0.0 -14.5

$CONNECTION_CONNECTION
15.5 0.0 0.0
14.5 0.0 0.0

$CONNECTION_CONNECTION
-15.5 0.0 0.0
-14.5 0.0 0.0

-- WRSR's cargo-heliport submenu classifier expects an aggregate input.
-- This single marker is buried 50 m below the pad, so it cannot be used or
-- connected in play and creates no visible aggregate connection.
$CONNECTION_CONVEYOR_INPUT
-12.0 -50.0 15.5
-12.0 -50.0 14.5

end
